---
name: 'Install CIJoe'
description: 'Install the CIJoe version that every spdk-ci job runs'

runs:
  using: 'composite'
  steps:
  - name: Set up uv
    uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    with:
      enable-cache: false

  - name: Install CIJoe
    shell: bash
    # setup-uv adds the uv tool bin directory to the front of PATH, so this
    # CIJoe runs instead of the one in the cijoe-docker image. The image tag
    # then only selects QEMU and the other tools.
    run: |
      uv tool install --constraints "$GITHUB_ACTION_PATH/requirements.txt" cijoe
      cijoe --version
